services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cs486-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting Docker}"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s